receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'temperature-simulator'
          static_configs:
            - targets: ['temperature-simulator:9090']
          metrics_path: '/actuator/prometheus'
          scrape_interval: 15s
        - job_name: 'temperature-calculator'
          static_configs:
            - targets: ['temperature-calculator:8088']
          metrics_path: '/actuator/prometheus'
          scrape_interval: 15s
processors:
  batch:
  resource:
    attributes:
      - key: deployment.environment
        value: "otel-course"
        action: upsert
exporters:
  otlp/jaeger:
    endpoint: "jaeger:4317"
    tls:
      insecure: true
  debug:
    verbosity: detailed
  datadog:
    api:
      site: ${DD_SITE}
      key: ${DD_API_KEY}
connectors:
  datadog/connector:
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [datadog, otlp/jaeger, datadog/connector] #debug
    metrics:
      receivers: [otlp, datadog/connector, prometheus]
      processors: [resource, batch]
      exporters: [datadog]
    logs:
      receivers: [otlp]
      processors: [resource, batch]
      exporters: [datadog]
